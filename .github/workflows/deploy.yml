# Builds the Astro site and publishes it to GitHub Pages.
#
# Runs only on pushes to main. In the repository's Settings > Pages, set
# "Source" to "GitHub Actions". The build output is dist/ (the same folder
# that is deployed to the Cloudflare Pages review site); where the site is
# served from is set once, in astro.config.mjs (SITE and BASE).
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

# Read the repository, write a Pages deployment, and prove who is deploying.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. A newer push waits for the current one rather
# than cancelling it part-way through a deployment.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Node (version from .nvmrc)
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Runs astro check, then astro build, into dist/.
      - name: Build
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload the site
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
